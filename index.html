<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractions - Positifs Uniquement</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa; /* Fond légèrement plus bleu/joyeux */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 4px solid #4dd0e1;
        }

        h1 {
            color: #00838f;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .score-board {
            font-size: 1.1rem;
            color: #006064;
            margin-bottom: 20px;
            background: #b2ebf2;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }

        .problem-box {
            font-size: 3rem;
            font-weight: bold;
            color: #37474f;
            margin: 25px 0;
            padding: 30px;
            background-color: #f5f5f5;
            border-radius: 15px;
            letter-spacing: 2px;
        }

        .input-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        input {
            width: 90px;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            border: 3px solid #b0bec5;
            border-radius: 10px;
            color: #37474f;
        }

        input:focus {
            border-color: #00bcd4;
            outline: none;
            background-color: #e0f7fa;
        }

        .fraction-sep {
            font-size: 2.5rem;
            font-weight: bold;
            color: #546e7a;
        }

        button {
            background-color: #00bcd4;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin: 5px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #0097a7;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background-color: #cfd8dc;
            color: #546e7a;
        }

        button.secondary:hover {
            background-color: #b0bec5;
        }

        #feedback {
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.2rem;
            min-height: 1.5em;
        }

        .success { color: #2e7d32; }
        .error { color: #c62828; }

        .hint {
            font-size: 0.95rem;
            color: #ef6c00;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Entraînement Fractions</h1>
        <div class="score-board">Score : <span id="score">0</span></div>
        
        <div id="problem" class="problem-box">...</div>

        <div class="input-area">
            <input type="number" id="userNum" placeholder="Num">
            <span class="fraction-sep">/</span>
            <input type="number" id="userDen" placeholder="Dén">
        </div>

        <button onclick="checkAnswer()" id="btn-check">Valider</button>
        <button onclick="generateProblem()" class="secondary">Passer</button>

        <div id="feedback"></div>
        <div id="correction" class="hint"></div>
    </div>

    <script>
        let currentProblem = {};
        let score = 0;

        // PGCD pour simplifier
        function pgcd(a, b) {
            return b === 0 ? a : pgcd(b, a % b);
        }

        // Fonction de simplification
        function simplify(n, d) {
            const diviseur = pgcd(n, d);
            return [n / diviseur, d / diviseur];
        }

        // Génère un entier positif entre min et max
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateProblem() {
            // Reset affichage
            document.getElementById('userNum').value = '';
            document.getElementById('userDen').value = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('correction').innerText = '';
            document.getElementById('btn-check').disabled = false;
            document.getElementById('userNum').focus();

            const types = ['+', '-', '*', ':', 'simp'];
            const type = types[Math.floor(Math.random() * types.length)];

            // Génération de nombres STRICTEMENT POSITIFS (entre 1 et 12 pour que ce soit faisable)
            let n1 = getRandomInt(1, 12);
            let d1 = getRandomInt(2, 12);
            
            let n2 = getRandomInt(1, 12);
            let d2 = getRandomInt(2, 12);

            let questionText = "";
            let correctNum, correctDen;

            switch (type) {
                case '+':
                    questionText = `${n1}/${d1} + ${n2}/${d2}`;
                    correctNum = (n1 * d2) + (n2 * d1);
                    correctDen = d1 * d2;
                    break;

                case '-':
                    // ASTUCE : On s'assure que la première fraction est plus grande que la deuxième
                    // pour éviter les résultats négatifs.
                    if ((n1/d1) < (n2/d2)) {
                        // On échange les fractions
                        [n1, n2] = [n2, n1];
                        [d1, d2] = [d2, d1];
                    }
                    questionText = `${n1}/${d1} - ${n2}/${d2}`;
                    correctNum = (n1 * d2) - (n2 * d1);
                    correctDen = d1 * d2;
                    break;

                case '*':
                    questionText = `${n1}/${d1} × ${n2}/${d2}`;
                    correctNum = n1 * n2;
                    correctDen = d1 * d2;
                    break;

                case ':':
                    questionText = `${n1}/${d1} ÷ ${n2}/${d2}`;
                    correctNum = n1 * d2;
                    correctDen = d1 * n2;
                    break;

                case 'simp':
                    let factor = getRandomInt(2, 6); // Facteur multiplicateur
                    n1 = getRandomInt(1, 20) * factor; // Numérateur plus grand
                    d1 = getRandomInt(2, 20) * factor;
                    questionText = `Simplifier : ${n1}/${d1}`;
                    correctNum = n1;
                    correctDen = d1;
                    break;
            }

            // On calcule la réponse simplifiée attendue
            const simplifiedAns = simplify(correctNum, correctDen);
            
            currentProblem = {
                text: questionText,
                num: simplifiedAns[0],
                den: simplifiedAns[1]
            };

            document.getElementById('problem').innerText = currentProblem.text;
        }

        function checkAnswer() {
            const uNum = parseInt(document.getElementById('userNum').value);
            const uDen = parseInt(document.getElementById('userDen').value);
            const feedback = document.getElementById('feedback');
            const correction = document.getElementById('correction');

            if (isNaN(uNum) || isNaN(uDen)) {
                feedback.innerText = "Remplis les deux cases !";
                feedback.className = "error";
                return;
            }

            if (uDen === 0) {
                feedback.innerText = "Division par 0 impossible !";
                feedback.className = "error";
                return;
            }

            // On simplifie la réponse de l'utilisateur
            const userSimp = simplify(uNum, uDen);

            if (userSimp[0] === currentProblem.num && userSimp[1] === currentProblem.den) {
                feedback.innerText = "Excellent ! Bonne réponse.";
                feedback.className = "success";
                score++;
                document.getElementById('score').innerText = score;
                document.getElementById('btn-check').disabled = true;
                
                // Si la réponse est juste mathématiquement mais pas simplifiée
                // Note : On compare avec la valeur absolue pour gérer les signes éventuels
                if (uNum !== currentProblem.num || uDen !== currentProblem.den) {
                   correction.innerText = `C'est juste ! (La forme simplifiée parfaite est ${currentProblem.num}/${currentProblem.den})`;
                }
                
                setTimeout(generateProblem, 2000); 
            } else {
                feedback.innerText = "Faux. Essaie encore !";
                feedback.className = "error";
                correction.innerText = ""; 
                // On n'affiche pas la correction tout de suite pour le laisser chercher
            }
        }

        // Touche Entrée
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        generateProblem();
    </script>
</body>
</html>
